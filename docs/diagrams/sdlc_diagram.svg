<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef5ff"/>
      <stop offset="100%" stop-color="#dfeaff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f8df7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1e3a8a" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#2563eb"/>
    </marker>
    <style>
      .title{font:700 42px Arial, sans-serif;fill:#0f172a}
      .sub{font:400 20px Arial, sans-serif;fill:#475569}
      .card{fill:#fff;stroke:#bfdbfe;stroke-width:2;filter:url(#shadow)}
      .label{font:700 24px Arial, sans-serif;fill:#0f172a}
      .small{font:400 16px Arial, sans-serif;fill:#64748b}
      .num{font:700 18px Arial, sans-serif;fill:#fff}
      .arrow{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="760" fill="url(#bg)"/>
  <circle cx="1180" cy="130" r="260" fill="none" stroke="#93c5fd" stroke-opacity=".35" stroke-width="2"/>
  <circle cx="210" cy="680" r="310" fill="none" stroke="#60a5fa" stroke-opacity=".24" stroke-width="2"/>
  <text x="70" y="86" class="title">Agile SDLC Diagram</text>
  <text x="72" y="122" class="sub">Student Consultation Scheduler development flow from planning to continuous enhancement.</text>

  <g transform="translate(75,220)">
    <rect class="card" x="0" y="0" width="250" height="120" rx="28"/>
    <circle cx="38" cy="38" r="18" fill="url(#blue)"/><text x="33" y="45" class="num">1</text>
    <text x="70" y="48" class="label">Planning</text>
    <text x="70" y="78" class="small">Define scope, users, and goals.</text>
  </g>
  <path class="arrow" d="M335 280 H445"/>

  <g transform="translate(465,220)">
    <rect class="card" x="0" y="0" width="250" height="120" rx="28"/>
    <circle cx="38" cy="38" r="18" fill="url(#blue)"/><text x="33" y="45" class="num">2</text>
    <text x="70" y="48" class="label">Requirements</text>
    <text x="70" y="78" class="small">Analyze booking and approval needs.</text>
  </g>
  <path class="arrow" d="M725 280 H835"/>

  <g transform="translate(855,220)">
    <rect class="card" x="0" y="0" width="250" height="120" rx="28"/>
    <circle cx="38" cy="38" r="18" fill="url(#blue)"/><text x="33" y="45" class="num">3</text>
    <text x="70" y="48" class="label">Design</text>
    <text x="70" y="78" class="small">Create UI, data, and flow designs.</text>
  </g>
  <path class="arrow" d="M1115 280 H1225"/>

  <g transform="translate(1125,400)">
    <rect class="card" x="0" y="0" width="250" height="120" rx="28"/>
    <circle cx="38" cy="38" r="18" fill="url(#blue)"/><text x="33" y="45" class="num">4</text>
    <text x="70" y="48" class="label">Development</text>
    <text x="70" y="78" class="small">Build dashboards and database logic.</text>
  </g>
  <path class="arrow" d="M1115 460 H1005"/>

  <g transform="translate(735,400)">
    <rect class="card" x="0" y="0" width="250" height="120" rx="28"/>
    <circle cx="38" cy="38" r="18" fill="url(#blue)"/><text x="33" y="45" class="num">5</text>
    <text x="70" y="48" class="label">Testing</text>
    <text x="70" y="78" class="small">Validate auth, booking, and realtime.</text>
  </g>
  <path class="arrow" d="M725 460 H615"/>

  <g transform="translate(345,400)">
    <rect class="card" x="0" y="0" width="250" height="120" rx="28"/>
    <circle cx="38" cy="38" r="18" fill="url(#blue)"/><text x="33" y="45" class="num">6</text>
    <text x="70" y="48" class="label">Deployment</text>
    <text x="70" y="78" class="small">Host and configure production URLs.</text>
  </g>
  <path class="arrow" d="M335 460 H225"/>

  <g transform="translate(75,400)">
    <rect class="card" x="0" y="0" width="250" height="120" rx="28"/>
    <circle cx="38" cy="38" r="18" fill="url(#blue)"/><text x="33" y="45" class="num">7</text>
    <text x="70" y="48" class="label">Maintenance</text>
    <text x="70" y="78" class="small">Improve features from feedback.</text>
  </g>

  <path class="arrow" d="M180 400 C160 330 170 270 210 240"/>
  <path class="arrow" d="M210 520 C270 640 1000 650 1140 525"/>
  <text x="470" y="625" class="sub">Agile is selected because calendar behavior, approval flow, and dashboard usability improve through repeated feedback.</text>
</svg>
