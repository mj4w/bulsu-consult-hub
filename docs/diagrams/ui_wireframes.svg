<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1400" viewBox="0 0 1800 1400">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#e6efff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1d4ed8" flood-opacity=".12"/>
    </filter>
    <style>
      .title{font:700 42px Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 18px Arial,sans-serif;fill:#475569}
      .label{font:700 25px Arial,sans-serif;fill:#0f172a}
      .frame{fill:#ffffff;stroke:#bfdbfe;stroke-width:2;filter:url(#shadow)}
      .sidebar{fill:#172554}
      .sidebar2{fill:#1e3a8a}
      .topbar{fill:#eff6ff;stroke:#bfdbfe;stroke-width:1.5}
      .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
      .card{fill:#ffffff;stroke:#dbeafe;stroke-width:1.5}
      .muted{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1.5}
      .blue{fill:#2563eb}
      .green{fill:#10b981}
      .purple{fill:#8b5cf6}
      .amber{fill:#f59e0b}
      .text{font:700 18px Arial,sans-serif;fill:#0f172a}
      .small{font:400 14px Arial,sans-serif;fill:#475569}
      .tiny{font:700 11px Arial,sans-serif;fill:#64748b;letter-spacing:1.5px}
      .white{font:700 13px Arial,sans-serif;fill:#ffffff}
      .whiteSmall{font:500 12px Arial,sans-serif;fill:#dbeafe}
      .grid{stroke:#cbd5e1;stroke-width:1}
    </style>
  </defs>

  <rect width="1800" height="1400" fill="url(#bg)"/>
  <text x="70" y="76" class="title">Initial UI Wireframes</text>
  <text x="72" y="110" class="subtitle">Aligned image wireframes for the student and instructor dashboards, calendar, and request review screens.</text>

  <g transform="translate(70,165)">
    <text x="0" y="-24" class="label">1. Student Dashboard</text>
    <rect class="frame" x="0" y="0" width="790" height="500" rx="26"/>
    <rect class="sidebar" x="0" y="0" width="108" height="500" rx="26"/>
    <rect class="sidebar" x="78" y="0" width="30" height="500"/>
    <circle cx="54" cy="48" r="21" fill="#ffffff"/>
    <text x="54" y="52" class="tiny" text-anchor="middle" dominant-baseline="middle">CS</text>
    <rect class="sidebar2" x="25" y="105" width="58" height="38" rx="12"/>
    <rect class="sidebar2" x="25" y="160" width="58" height="38" rx="12"/>
    <rect class="sidebar2" x="25" y="215" width="58" height="38" rx="12"/>
    <rect class="sidebar2" x="25" y="270" width="58" height="38" rx="12"/>
    <rect class="topbar" x="108" y="0" width="682" height="70"/>
    <rect class="card" x="135" y="20" width="340" height="30" rx="15"/>
    <text x="155" y="40" class="small">Search consultations, dates, instructors</text>
    <circle cx="700" cy="35" r="15" fill="#2563eb"/>
    <circle cx="742" cy="35" r="15" fill="#dbeafe"/>
    <text x="135" y="110" class="tiny">STUDENT DASHBOARD</text>
    <text x="135" y="143" class="text">Welcome, Student Name</text>
    <text x="135" y="168" class="small">Review consultation statistics and current status.</text>
    <rect class="card" x="135" y="198" width="190" height="92" rx="18"/>
    <text x="155" y="228" class="small">Upcoming consultations</text>
    <text x="155" y="266" class="text">1</text>
    <rect class="card" x="350" y="198" width="190" height="92" rx="18"/>
    <text x="370" y="228" class="small">Pending requests</text>
    <text x="370" y="266" class="text">0</text>
    <rect class="card" x="565" y="198" width="190" height="92" rx="18"/>
    <text x="585" y="228" class="small">Profile status</text>
    <text x="585" y="266" class="text">Complete</text>
    <rect class="blue" x="135" y="315" width="620" height="92" rx="20"/>
    <text x="160" y="345" class="white">CONFIRMED CONSULTATION</text>
    <text x="160" y="370" class="white">Next consultation scheduled</text>
    <text x="160" y="393" class="whiteSmall">Instructor, date, time, format, and purpose</text>
    <rect class="card" x="135" y="430" width="295" height="45" rx="14"/>
    <text x="155" y="458" class="small">Consultation history summary</text>
    <rect class="card" x="460" y="430" width="295" height="45" rx="14"/>
    <text x="480" y="458" class="small">Guidance and reminders</text>
  </g>

  <g transform="translate(940,165)">
    <text x="0" y="-24" class="label">2. Student Calendar</text>
    <rect class="frame" x="0" y="0" width="790" height="500" rx="26"/>
    <rect class="sidebar" x="0" y="0" width="108" height="500" rx="26"/>
    <rect class="sidebar" x="78" y="0" width="30" height="500"/>
    <rect class="topbar" x="108" y="0" width="682" height="70"/>
    <text x="135" y="110" class="tiny">CONSULTATION CALENDAR</text>
    <text x="135" y="143" class="text">Find a time to talk</text>
    <rect class="card" x="445" y="105" width="80" height="38" rx="12"/>
    <text x="468" y="130" class="small">Today</text>
    <rect class="card" x="540" y="105" width="185" height="38" rx="12"/>
    <text x="570" y="130" class="small">Aug 10 - Aug 16</text>
    <rect class="panel" x="135" y="170" width="590" height="275" rx="18"/>
    <line class="grid" x1="195" y1="170" x2="195" y2="445"/>
    <line class="grid" x1="301" y1="170" x2="301" y2="445"/>
    <line class="grid" x1="407" y1="170" x2="407" y2="445"/>
    <line class="grid" x1="513" y1="170" x2="513" y2="445"/>
    <line class="grid" x1="619" y1="170" x2="619" y2="445"/>
    <line class="grid" x1="135" y1="220" x2="725" y2="220"/>
    <line class="grid" x1="135" y1="280" x2="725" y2="280"/>
    <line class="grid" x1="135" y1="340" x2="725" y2="340"/>
    <line class="grid" x1="135" y1="400" x2="725" y2="400"/>
    <text x="148" y="205" class="small">7 AM</text>
    <text x="148" y="265" class="small">8 AM</text>
    <text x="148" y="325" class="small">9 AM</text>
    <text x="145" y="385" class="small">10 AM</text>
    <text x="222" y="195" class="tiny">MON</text>
    <text x="330" y="195" class="tiny">TUE</text>
    <text x="436" y="195" class="tiny">WED</text>
    <text x="542" y="195" class="tiny">THU</text>
    <rect class="blue" x="208" y="235" width="82" height="170" rx="10"/>
    <text x="220" y="318" class="white">F2F</text>
    <text x="220" y="340" class="white">8:00-10:30</text>
    <rect class="purple" x="314" y="250" width="82" height="120" rx="10"/>
    <text x="326" y="312" class="white">Online</text>
    <text x="326" y="334" class="white">Pending</text>
    <rect class="green" x="526" y="230" width="82" height="115" rx="10"/>
    <text x="538" y="285" class="white">Approved</text>
    <text x="538" y="307" class="white">9:00-9:30</text>
    <text x="135" y="472" class="small">Available schedules and request status are clickable and open a details modal.</text>
  </g>

  <g transform="translate(70,760)">
    <text x="0" y="-24" class="label">3. Request Consultation Modal</text>
    <rect class="frame" x="0" y="0" width="520" height="520" rx="26"/>
    <text x="35" y="48" class="text">Request Consultation</text>
    <text x="468" y="48" class="text">x</text>
    <line x1="35" y1="72" x2="485" y2="72" stroke="#dbeafe"/>
    <text x="35" y="110" class="small">Instructor</text>
    <rect class="muted" x="35" y="125" width="450" height="42" rx="12"/>
    <text x="55" y="152" class="small">Instructor Name</text>
    <text x="35" y="200" class="small">Preferred Time</text>
    <rect class="muted" x="35" y="215" width="210" height="42" rx="12"/>
    <text x="55" y="242" class="small">10:00 AM</text>
    <rect class="muted" x="275" y="215" width="210" height="42" rx="12"/>
    <text x="295" y="242" class="small">10:30 AM</text>
    <text x="35" y="290" class="small">Purpose</text>
    <rect class="card" x="35" y="305" width="100" height="36" rx="18"/>
    <text x="58" y="328" class="small">Research</text>
    <rect class="card" x="148" y="305" width="90" height="36" rx="18"/>
    <text x="174" y="328" class="small">Grades</text>
    <rect class="card" x="251" y="305" width="100" height="36" rx="18"/>
    <text x="273" y="328" class="small">Projects</text>
    <text x="35" y="375" class="small">Concern Details</text>
    <rect class="muted" x="35" y="390" width="450" height="58" rx="12"/>
    <line x1="35" y1="470" x2="485" y2="470" stroke="#dbeafe"/>
    <rect class="card" x="245" y="482" width="110" height="42" rx="18"/>
    <text x="300" y="508" class="small" text-anchor="middle">Cancel</text>
    <rect class="blue" x="370" y="482" width="115" height="42" rx="18"/>
    <text x="427.5" y="508" class="white" text-anchor="middle">Send</text>
  </g>

  <g transform="translate(650,760)">
    <text x="0" y="-24" class="label">4. Instructor Dashboard</text>
    <rect class="frame" x="0" y="0" width="520" height="485" rx="26"/>
    <rect class="sidebar" x="0" y="0" width="88" height="485" rx="26"/>
    <rect class="topbar" x="88" y="0" width="432" height="62"/>
    <rect class="card" x="110" y="18" width="240" height="28" rx="14"/>
    <text x="128" y="37" class="small">Search requests</text>
    <text x="112" y="105" class="tiny">INSTRUCTOR DASHBOARD</text>
    <text x="112" y="136" class="text">Welcome, Instructor</text>
    <rect class="card" x="112" y="170" width="120" height="88" rx="16"/>
    <text x="132" y="200" class="small">Active</text>
    <text x="132" y="235" class="text">4</text>
    <rect class="card" x="252" y="170" width="120" height="88" rx="16"/>
    <text x="272" y="200" class="small">Pending</text>
    <text x="272" y="235" class="text">2</text>
    <rect class="card" x="392" y="170" width="100" height="88" rx="16"/>
    <text x="412" y="200" class="small">Approved</text>
    <text x="412" y="235" class="text">8</text>
    <rect class="card" x="112" y="295" width="380" height="70" rx="16"/>
    <text x="135" y="325" class="text">Consultation Requests</text>
    <text x="135" y="350" class="small">Open pending and reviewed records</text>
    <rect class="card" x="112" y="385" width="380" height="70" rx="16"/>
    <text x="135" y="415" class="text">Availability Calendar</text>
    <text x="135" y="440" class="small">Create or edit consultation windows</text>
  </g>

  <g transform="translate(1230,760)">
    <text x="0" y="-24" class="label">5. Instructor Requests</text>
    <rect class="frame" x="0" y="0" width="520" height="485" rx="26"/>
    <text x="35" y="50" class="text">Review Consultation Requests</text>
    <rect class="card" x="35" y="78" width="450" height="38" rx="14"/>
    <text x="55" y="103" class="small">Search by student, date, purpose</text>
    <rect class="panel" x="35" y="140" width="215" height="300" rx="18"/>
    <text x="58" y="172" class="text">Pending</text>
    <rect class="card" x="58" y="195" width="170" height="88" rx="14"/>
    <text x="75" y="222" class="small">Student Name</text>
    <text x="75" y="247" class="small">Research</text>
    <rect class="amber" x="75" y="258" width="65" height="18" rx="9"/>
    <rect class="card" x="58" y="305" width="170" height="88" rx="14"/>
    <text x="75" y="332" class="small">Student Name</text>
    <text x="75" y="357" class="small">Projects</text>
    <rect class="panel" x="270" y="140" width="215" height="300" rx="18"/>
    <text x="293" y="172" class="text">Reviewed</text>
    <rect class="card" x="293" y="195" width="170" height="88" rx="14"/>
    <text x="310" y="222" class="small">Approved</text>
    <text x="310" y="247" class="small">10:00-10:30</text>
    <rect class="card" x="293" y="305" width="170" height="88" rx="14"/>
    <text x="310" y="332" class="small">Declined</text>
    <text x="310" y="357" class="small">1:00-1:30</text>
  </g>
</svg>
