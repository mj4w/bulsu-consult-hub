<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2650" viewBox="0 0 1600 2650">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#e4efff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1d4ed8" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#2563eb"/>
    </marker>
    <style>
      .title{font:700 42px Arial,sans-serif;fill:#0f172a}
      .sub{font:400 18px Arial,sans-serif;fill:#475569}
      .start{fill:url(#blue);stroke:#1d4ed8;stroke-width:2;filter:url(#shadow)}
      .step{fill:#ffffff;stroke:#93c5fd;stroke-width:2;filter:url(#shadow)}
      .decision{fill:#eff6ff;stroke:#2563eb;stroke-width:2;filter:url(#shadow)}
      .success{fill:#ecfdf5;stroke:#10b981;stroke-width:2;filter:url(#shadow)}
      .error{fill:#fff7ed;stroke:#f97316;stroke-width:2;filter:url(#shadow)}
      .text{font:700 18px Arial,sans-serif;fill:#0f172a;text-anchor:middle}
      .small{font:500 14px Arial,sans-serif;fill:#475569;text-anchor:middle}
      .white{font:700 18px Arial,sans-serif;fill:#fff;text-anchor:middle}
      .line{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .label{font:700 14px Arial,sans-serif;fill:#1d4ed8}
      .section{font:700 20px Arial,sans-serif;fill:#1e3a8a;text-anchor:middle}
      .divider{stroke:#bfdbfe;stroke-width:2;stroke-dasharray:8 8}
    </style>
  </defs>

  <rect width="1600" height="2650" fill="url(#bg)"/>
  <text x="70" y="78" class="title">System Flowchart</text>
  <text x="72" y="112" class="sub">Full image version of the Activity No. 2 system flowchart with corrected non-conflicting connections.</text>

  <rect class="start" x="500" y="165" width="600" height="72" rx="36"/>
  <text x="800" y="208" class="white">User opens Student Consultation Scheduler</text>
  <path class="line" d="M800 237 V285"/>

  <rect class="step" x="600" y="285" width="400" height="72" rx="20"/>
  <text x="800" y="328" class="text">Sign in using Microsoft</text>
  <path class="line" d="M800 357 V410"/>

  <path class="decision" d="M800 410 L1010 490 L800 570 L590 490 Z"/>
  <text x="800" y="486" class="text">Authentication successful?</text>
  <path class="line" d="M590 490 H320 V321 H600"/>
  <text x="350" y="472" class="label">No</text>
  <rect class="error" x="120" y="285" width="260" height="72" rx="20"/>
  <text x="250" y="328" class="text">Show sign-in error</text>

  <path class="line" d="M800 570 V630"/>
  <text x="820" y="602" class="label">Yes</text>
  <path class="decision" d="M800 630 L1000 710 L800 790 L600 710 Z"/>
  <text x="800" y="706" class="text">Identify user role</text>

  <line class="divider" x1="800" y1="850" x2="800" y2="1395"/>
  <text x="410" y="940" class="section">Student Flow</text>
  <text x="1190" y="940" class="section">Instructor Availability Flow</text>

  <path class="line" d="M680 770 C560 820 480 850 410 910"/>
  <text x="610" y="850" class="label">Student</text>
  <rect class="step" x="210" y="910" width="400" height="72" rx="20"/>
  <text x="410" y="953" class="text">Open Student Dashboard</text>
  <path class="line" d="M410 982 V1035"/>

  <path class="decision" d="M410 1035 L595 1110 L410 1185 L225 1110 Z"/>
  <text x="410" y="1106" class="text">Student profile complete?</text>
  <path class="line" d="M225 1110 H135 V1270 H210"/>
  <text x="150" y="1095" class="label">No</text>
  <rect class="step" x="210" y="1235" width="400" height="72" rx="20"/>
  <text x="410" y="1264" class="text">Complete required</text>
  <text x="410" y="1288" class="text">student information</text>

  <path class="line" d="M410 1185 V1235"/>
  <text x="430" y="1212" class="label">Yes</text>
  <path class="line" d="M610 1271 H695"/>

  <rect class="step" x="695" y="1235" width="410" height="72" rx="20"/>
  <text x="900" y="1278" class="text">Open consultation calendar</text>
  <path class="line" d="M900 1307 V1360"/>

  <rect class="step" x="695" y="1360" width="410" height="72" rx="20"/>
  <text x="900" y="1403" class="text">Select available instructor schedule</text>
  <path class="line" d="M900 1432 V1485"/>

  <rect class="step" x="695" y="1485" width="410" height="72" rx="20"/>
  <text x="900" y="1514" class="text">Enter purpose and</text>
  <text x="900" y="1538" class="text">concern details</text>
  <path class="line" d="M900 1557 V1610"/>

  <rect class="step" x="695" y="1610" width="410" height="72" rx="20"/>
  <text x="900" y="1653" class="text">Submit consultation request</text>
  <path class="line" d="M900 1682 V1735"/>

  <rect class="step" x="695" y="1735" width="410" height="72" rx="20"/>
  <text x="900" y="1764" class="text">Request status becomes Pending</text>
  <text x="900" y="1788" class="small">Notify instructor</text>

  <path class="line" d="M920 770 C1040 820 1120 850 1190 910"/>
  <text x="990" y="850" class="label">Instructor</text>
  <rect class="step" x="990" y="910" width="400" height="72" rx="20"/>
  <text x="1190" y="953" class="text">Open Instructor Dashboard</text>
  <path class="line" d="M1190 982 V1035"/>

  <rect class="step" x="990" y="1035" width="400" height="72" rx="20"/>
  <text x="1190" y="1064" class="text">Create consultation availability</text>
  <text x="1190" y="1088" class="small">Date, time, format, program scope</text>
  <path class="line" d="M1190 1107 V1160"/>

  <rect class="step" x="990" y="1160" width="400" height="72" rx="20"/>
  <text x="1190" y="1189" class="text">Availability appears to</text>
  <text x="1190" y="1213" class="text">matching students</text>

  <path class="line" d="M1105 1771 H1190 V1855"/>
  <rect class="step" x="990" y="1855" width="400" height="72" rx="20"/>
  <text x="1190" y="1898" class="text">Instructor reviews request</text>
  <path class="line" d="M1190 1927 V1980"/>

  <path class="decision" d="M1190 1980 L1375 2055 L1190 2130 L1005 2055 Z"/>
  <text x="1190" y="2051" class="text">Approve request?</text>

  <path class="line" d="M1005 2055 H735"/>
  <text x="875" y="2038" class="label">No</text>
  <rect class="error" x="445" y="2019" width="290" height="72" rx="20"/>
  <text x="590" y="2062" class="text">Decline request</text>
  <path class="line" d="M590 2091 V2140"/>
  <rect class="step" x="445" y="2140" width="290" height="50" rx="18"/>
  <text x="590" y="2171" class="text">Notify student</text>

  <path class="line" d="M1190 2130 V2180"/>
  <text x="1210" y="2154" class="label">Yes</text>
  <rect class="step" x="1030" y="2180" width="320" height="72" rx="20"/>
  <text x="1190" y="2223" class="text">Approve consultation</text>
  <path class="line" d="M1190 2252 V2305"/>

  <path class="decision" d="M1190 2305 L1355 2372 L1190 2439 L1025 2372 Z"/>
  <text x="1190" y="2368" class="text">Schedule conflict?</text>
  <text x="1190" y="2392" class="small">Check overlap</text>

  <path class="line" d="M1025 2372 H735"/>
  <text x="880" y="2355" class="label">Yes</text>
  <rect class="error" x="445" y="2336" width="290" height="72" rx="20"/>
  <text x="590" y="2365" class="text">Reject conflicting</text>
  <text x="590" y="2389" class="text">approval</text>

  <path class="line" d="M1190 2439 V2490"/>
  <text x="1210" y="2464" class="label">No</text>
  <rect class="success" x="1010" y="2490" width="360" height="82" rx="20"/>
  <text x="1190" y="2521" class="text">Confirm schedule</text>
  <text x="1190" y="2545" class="small">Notify student</text>
  <text x="1190" y="2565" class="small">Update student and instructor calendars</text>
</svg>
